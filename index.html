<script>
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const int=(r,lo,hi)=>lo+Math.floor(r()*(hi-lo+1));
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const RD=x=>Math.round(x*1e9)/1e9;
function fmt(x){x=RD(x);const ax=Math.abs(x);let s=Number.isInteger(ax)&&ax>=1000?ax.toLocaleString("en-US"):String(ax);if(/e/i.test(s))s=ax.toFixed(14).replace(/0+$/,"");return(x<0?"−":"")+s}
const fE=e=>typeof e==="number"?(e<0?"−"+(-e):String(e)):e;
const fP=n=>n<0?`(${fmt(n)})`:fmt(n);
const pw=(b,e)=>`${typeof b==="number"?fmt(b):b}<sup>${fE(e)}</sup>`;
const sn=(c,e)=>`${fmt(c)} × 10<sup>${fE(e)}</sup>`;
const plain=h=>String(h).replace(/<sup>/g,"^").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function mc(r,good,bad){const seen=new Set([plain(good)]);const items=[[good,null]];
  for(const [t,w] of bad){const k=plain(t);if(seen.has(k))continue;seen.add(k);items.push([t,w]);if(items.length===4)break}
  const sh=shuffle(r,items);return{opts:sh.map(x=>x[0]),ww:sh.map(x=>x[1]),ans:sh.findIndex(x=>x[1]===null)}}
function stp(r,o){const m=mc(r,o.good,o.bad);return{p:o.p,po:m.opts,pw:m.ww,pa:m.ans,t:o.t||"",a:o.a||null,kind:o.kind||"num",ans:o.ans,opts:o.opts,h:o.h||"Check your arithmetic, especially the signs.",tol:o.tol}}
function item(skill,lvl,q,good,bad,steps,r){const m=mc(r,good,bad);return{skill,lvl,q,opts:m.opts,ww:m.ww,ans:m.ans,steps}}
const ord=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");
function bigDigits(ds,e){return Number(ds.padEnd(e+1,"0")).toLocaleString("en-US")}
function smallDigits(ds,e){return "0."+"0".repeat(-e-1)+ds}
const cDigits=c=>String(c).replace(".","").replace(/^0+/,"");

// ===== Aviaana · enVision Algebra 1 · Topic 3 Linear Functions (3-1, 3-2, 3-4, 3-5, 3-6) =====
// ----- number + text helpers -----
function frc(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return[n/g,d/g]}
function fs(n,d=1){[n,d]=frc(n,d);return(n<0?"−":"")+(d===1?Math.abs(n):Math.abs(n)+"/"+d)}
const fv=(m)=>m[0]/m[1];
// coefficient on x: m = [n,d]
function cx(m,v="x"){const [n,d]=frc(m[0],m[1]);if(n===0)return"";if(d===1)return n===1?v:n===-1?"−"+v:fmt(n)+v;return(n<0?"−":"")+`(${Math.abs(n)}/${d})${v}`}
// "f(x) = 2x − 3" style. m,b are [n,d] or numbers
const R2=v=>Array.isArray(v)?v:[v,1];
function lin(m,b,lhs="y",v="x"){m=R2(m);b=R2(b);const [bn,bd]=frc(b[0],b[1]);let s=lhs+" = ";const t=cx(m,v);
  if(t){s+=t;if(bn!==0)s+=(bn>0?" + ":" − ")+fs(Math.abs(bn),bd)}else s+=fs(bn,bd);return s}
// decimal version: y = 3.2x + 14
function linD(m,b,lhs="y",v="x"){let s=lhs+" = ";s+=(m===1?"":m===-1?"−":fmt(m))+v;if(b!==0)s+=(b>0?" + ":" − ")+fmt(Math.abs(b));return s}
const P=(x,y)=>`(${fmt(x)}, ${fmt(y)})`;
const setS=a=>`{${a.join(", ")}}`;
const pairsS=ps=>`{${ps.map(p=>P(p[0],p[1])).join(", ")}}`;
const sub=s=>`<sub>${s}</sub>`;

       stp(r,{p:"Now get t alone. How?",good:`Divide by ${fmt(rate)}`,bad:[[`Subtract ${fmt(rate)}`,`${fmt(rate)}t means ${fmt(rate)} times t.`],[`Multiply by ${fmt(rate)}`,"Undo multiplying with dividing."]],a:`t = ${fmt(RD(start-target))} ÷ ${fmt(rate)} = ?`,ans:T})],r)}
  if(v==="interpret"){const c=pick(r,[["s(x)","the money in Jamal's savings account after x weeks","dollars"],["d(x)","the distance a hiker is from the trailhead after x hours","miles"],["p(x)","the number of pages Mia has read after x days","pages"]]);
    const m=c[2]==="miles"?pick(r,[2.5,3,3.5]):c[2]==="pages"?pick(r,[25,30,35,40]):pick(r,[15,20,25,40]),b=c[2]==="miles"?pick(r,[1,2,4]):c[2]==="pages"?pick(r,[12,20,45]):pick(r,[60,80,120,150]);const askM=r()<0.6;
    const unit=c[0]==="d(x)"?"hour":c[0]==="p(x)"?"day":"week";
    const sM=`${fmt(m)} ${c[2]} added each ${unit}`,sB=`${fmt(b)} ${c[2]} at the start (when x = 0)`;
    return item("a2_word","Word",`The function ${c[0]} = ${fmt(m)}x + ${fmt(b)} gives ${c[1]}. What does ${fmt(askM?m:b)} represent?`,askM?`The rate: ${sM}`:`The starting amount: ${sB}`,
      [[askM?`The starting amount: ${fmt(m)} ${c[2]} at the start`:`The rate: ${fmt(b)} ${c[2]} added each ${unit}`,askM?"The starting amount is the constant term, the value when x = 0.":"The rate is the number multiplied by x."],[`The total after 1 ${unit}`,`After 1 ${unit} the total is ${fmt(m+b)}.`],[`The number of ${unit}s`,`x is the number of ${unit}s.`]],
      [stp(r,{p:"In f(x) = mx + b, what do m and b mean in a story?",good:"m is the rate of change (per one of x). b is the starting value (when x = 0)",bad:[["m is the starting value. b is the rate","Swap them: m multiplies x, so it changes with x."],["m and b are both totals","Only f(x) is a total."]],a:`What is ${c[0].replace("x","0")}?`,ans:b})],r)}
  // domain in context
  const c=pick(r,[["A phone battery starts at 100% and drops","% per hour until it is empty","b(t) = 100 − ","t"],["A 120-gallon tank starts full and drains","gallons per minute until it is empty","w(t) = 120 − ","t"]]);
  const start=c[0].includes("100%")?100:120,rate=pick(r,start===100?[4,5,8,10,20]:[4,5,6,8,10,12]),T=RD(start/rate);
  return item("a2_word","Challenge",`${c[0]} ${rate}${c[1]}. It is modeled by ${c[2]}${rate}${c[3]}. What is a reasonable domain?`,`0 ≤ t ≤ ${fmt(T)}`,
    [[`0 ≤ t ≤ ${start}`,`${start} is the starting output. Find the time when it reaches 0.`],["t ≥ 0","It stops once it is empty, so time has an end point."],[`{0, 1, 2, …, ${Math.floor(T)}}`,"Time is continuous, so the domain is an interval, not a list."],[`0 ≤ ${c[2][0]} ≤ ${start}`,"That's the range (outputs)."]],
    [stp(r,{p:"Where does the domain end?",good:"When the amount reaches 0",bad:[[`When t reaches ${start}`,`${start} is an amount, not a time.`],["It never ends","Once it's empty the model stops."]],a:`Solve ${start} − ${rate}t = 0. t = ?`,ans:T})],r)};

// ---------- 3-4 ----------
function seqPlan(r){return stp(r,{p:"What is an arithmetic sequence?",good:"A list where you add the same number (the common difference) each time",bad:[["A list where you multiply by the same number each time","Multiplying by the same number makes a geometric sequence."],["Any list of numbers that goes up","It can go down too, but the change must be the same every time."]],t:"The common difference d = any term minus the term before it. It can be negative."})}
G.a4_seq=(r,o)=>{const v=o.v||pick(r,VARS.a4_seq);
  if(v==="diff"){const a1=int(r,-10,25),d=nz(r,-9,9);
    return item("a4_seq","Basic",`What is the common difference of the arithmetic sequence ${seqS(a1,d)}?`,fmt(d),[[fmt(-d),"Subtract in order: a later term minus the term before it."],[fmt(a1),"That's the first term."],[fmt(2*d),"Compare terms that are next to each other."],[fmt(a1+d),"That's the second term."]],
      [seqPlan(r),stp(r,{p:"Which subtraction gives d?",good:"Second term − first term",bad:[["First term − second term","That gives the opposite sign."],["Last term − first term","That spans several steps."]],a:`${fmt(a1+d)} − ${a1<0?"("+fmt(a1)+")":fmt(a1)} = ?`,ans:d})],r)}
  if(v==="next"){const a1=pick(r,[1.5,2.5,0.75,-3.5,4.25,10.5]),d=pick(r,[1.25,-0.5,0.75,-1.5,2.5,0.25]);const t5=RD(a1+4*d);
    return item("a4_seq","Challenge",`What is the next term of the arithmetic sequence ${seqS(a1,d)}?`,fmt(t5),[[fmt(RD(t5+d)),"That skips a term. The next term comes right after the 4th."],[fmt(RD(a1+4*-d)),"Check the direction: are the terms going up or down?"],[fmt(RD(a1+3*d+1)),"Add the common difference, not 1."],[fmt(RD(t5-2*d)),"Add d to the last term shown."]],
      [seqPlan(r),stp(r,{p:"How do we find the next term?",good:"Add the common difference to the last term",bad:[["Add the first term to the last term","Only d is added each time."],["Double the last term","That's multiplying."]],a:`d = ${fmt(RD(a1+d))} − ${a1<0?"("+fmt(a1)+")":fmt(a1)} = ?`,ans:d}),
       stp(r,{p:"Now?",good:`${fmt(RD(a1+3*d))} + (${fmt(d)})`,bad:[[`${fmt(RD(a1+3*d))} − (${fmt(d)})`,"Add d, don't subtract it."],[`${fmt(a1)} + (${fmt(d)})`,"Start from the last term shown."]],a:"next term = ?",ans:t5})],r)}
  // isarith
  const not=r()<0.4;const a1=int(r,-8,12),d=nz(r,-7,7);const ar=seqS(a1,d);const g0=pick(r,[1,2,3]),q=pick(r,[2,3]);
  const nonA=[[`${g0}, ${g0*q}, ${g0*q*q}, ${g0*q*q*q}, …`,`This multiplies by ${q} each time, so the differences change.`],[`${fmt(a1)}, ${fmt(a1+2)}, ${fmt(a1+5)}, ${fmt(a1+9)}, …`,"The differences are 2, 3, 4. They aren't the same."],[`1, 4, 9, 16, …`,"These are square numbers. The differences are 3, 5, 7."],[`${fmt(a1)}, ${fmt(a1+d)}, ${fmt(a1)}, ${fmt(a1+d)}, …`,`The differences switch between ${fmt(d)} and ${fmt(-d)}.`]];
  const ars=[[seqS(int(r,-5,5),nz(r,-6,-1)),"This subtracts the same number each time, so it is arithmetic."],[seqS(int(r,10,30),nz(r,2,8)),"This adds the same number each time, so it is arithmetic."],[seqS(pick(r,[0.5,1.5,2.5]),0.5),"This adds 0.5 each time, so it is arithmetic."]];
  if(!not)return item("a4_seq","Basic","Which sequence is arithmetic?",ar,shuffle(r,nonA).slice(0,3),
    [seqPlan(r),stp(r,{p:`Test ${ar.replace(", …","")}. What are the differences between neighbors?`,good:`All ${fmt(d)}`,bad:[[`They change each time`,"Subtract each term from the next one and compare."],[`All ${fmt(-d)}`,"Later term minus earlier term. Watch the sign."]],a:"common difference = ?",ans:d})],r);
  const goodN=pick(r,nonA);
  return item("a4_seq","Challenge","Which sequence is <b>not</b> arithmetic?",goodN[0],ars,
    [seqPlan(r),stp(r,{p:"How do we test a sequence?",good:"Find the difference between each pair of neighbors and see if they are all the same",bad:[["Check that it goes up","Arithmetic sequences can go down."],["Check that every term is a whole number","Decimals and fractions are fine."]],t:goodN[1]})],r)};

G.a4_explicit=(r,o)=>{const v=o.v||pick(r,VARS.a4_explicit);const a1=nz(r,-12,20),d=nz(r,-9,9);
  if(v==="formula"){const bad=[[expl(d,a1),"Swapped. The first term goes first, and d multiplies (n − 1)."],[`${an("n")} = ${fmt(a1)} ${d<0?"−":"+"} ${fmt(Math.abs(d))}n`,`Use (n − 1). Check n = 1: it should give ${fmt(a1)}.`],[expl(a1,-d),"Check the sign of d. Are the terms going up or down?"],[`${an("n")} = ${fmt(a1)}n ${d<0?"−":"+"} ${fmt(Math.abs(d))}`,"The common difference multiplies (n − 1), not the first term."]];
    return item("a4_explicit","Basic",`Which is an explicit formula for ${seqS(a1,d)}?`,expl(a1,d),bad,
      [seqPlan(r),stp(r,{p:"What is the explicit formula pattern?",good:`${an("n")} = ${an(1)} + d(n − 1)`,bad:[[`${an("n")} = ${an(1)} + dn`,"That would add d one extra time."],[`${an("n")} = d + ${an(1)}(n − 1)`,"The first term is not multiplied."]],a:`${an(1)} = ?`,ans:a1}),
       stp(r,{p:"And d?",good:"Second term minus first term",bad:[["First term minus second term","That flips the sign."],["The second term","d is a difference."]],a:"d = ?",ans:d})],r)}
  if(v==="which"){const a1p=int(r,-5,15),dp=nz(r,2,9)*(r()<0.7?1:-1),n=int(r,15,60),val=a1p+(n-1)*dp;
    return item("a4_explicit","Challenge",`In the arithmetic sequence ${seqS(a1p,dp)}, which term is ${fmt(val)}? (What is n?)`,fmt(n),[[fmt(n-1),"Don't forget the +1 at the end: n − 1 = …, so n = … + 1."],[fmt(n+1),"Check: put your n back into the formula."],[fmt(RD(Math.round(val/dp*100)/100)),"Divide the change from the first term, not the whole value."]].filter(x=>x[0]!==fmt(n)),
      [seqPlan(r),stp(r,{p:"Set up the equation:",good:`${fmt(val)} = ${fmt(a1p)} + ${dp<0?"("+fmt(dp)+")":fmt(dp)}(n − 1)`,bad:[[`n = ${fmt(a1p)} + ${fmt(dp)}(${fmt(val)} − 1)`,`${fmt(val)} is the value of the term, not n.`],[`${fmt(val)} = ${fmt(a1p)}n + ${fmt(dp)}`,"Use the pattern a₁ + d(n − 1)."]],a:`${fmt(val)} − ${a1p<0?"("+fmt(a1p)+")":fmt(a1p)} = ?`,ans:val-a1p}),
       stp(r,{p:"Now?",good:`Divide by ${fmt(dp)} to get n − 1, then add 1`,bad:[[`Divide by ${fmt(dp)} and stop`,"That gives n − 1, not n."],[`Subtract ${fmt(dp)}`,"d multiplies (n − 1), so divide."]],a:`n − 1 = ${fmt(val-a1p)} ÷ ${dp<0?"("+fmt(dp)+")":fmt(dp)} = ?`,ans:n-1})],r)}
  const n=int(r,18,60),ans=a1+(n-1)*d;
  return item("a4_explicit","Basic",`What is the ${n}th term of the arithmetic sequence ${seqS(a1,d)}?`,fmt(ans),[[fmt(a1+n*d),`That adds d ${n} times. From the 1st term to the ${n}th there are only ${n-1} steps.`],[fmt(n*d),"Start from the first term."],[fmt(a1-(n-1)*d),"Check the sign of d."],[fmt(a1*(n-1)+d),"d multiplies (n − 1), not the first term."]],
    [seqPlan(r),stp(r,{p:`How many times do we add d to get from the 1st term to the ${n}th?`,good:`${n} − 1 times`,bad:[[`${n} times`,"The first term already counts as term 1."],[`${n} + 1 times`,"Count the gaps between terms."]],a:`d = ?`,ans:d}),
     stp(r,{p:"Use the formula:",good:`${an(n)} = ${fmt(a1)} + ${d<0?"("+fmt(d)+")":fmt(d)}(${n} − 1)`,bad:[[`${an(n)} = ${fmt(a1)} + ${fmt(d)}(${n})`,"Use n − 1."],[`${an(n)} = ${fmt(d)} + ${fmt(a1)}(${n} − 1)`,"The first term isn't multiplied."]],a:`${fmt(d)} × ${n-1} = ?`,ans:d*(n-1)})],r)};

G.a4_recursive=(r,o)=>{const v=o.v||pick(r,VARS.a4_recursive);const a1=nz(r,-10,24),d=nz(r,-9,9);
  if(v==="write"){return item("a4_recursive","Basic",`Which recursive formula describes ${seqS(a1,d)}?`,recu(a1,d),
    [[recu(a1,-d),"Check the sign: are the terms going up or down?"],[recu(d,a1),"Swapped. a₁ is the first term, and the common difference is added each time."],[`${an(1)} = ${fmt(a1)}; ${an("n")} = ${fmt(d)}·${an("n−1")}`,"Arithmetic sequences add the same number, they don't multiply."],[`${an(1)} = ${fmt(a1+d)}; ${an("n")} = ${an("n−1")} ${d<0?"−":"+"} ${fmt(Math.abs(d))}`,`${fmt(a1+d)} is the second term.`]],
    [seqPlan(r),stp(r,{p:"A recursive formula needs two parts. What are they?",good:"The first term, and a rule to get each term from the one before",bad:[["The first term and the last term","Sequences can go on forever."],["A rule using n only","That's an explicit formula."]],a:`${an(1)} = ?  And d = second term − first term. What is d?`,ans:d,t:`${an(1)} = ${fmt(a1)}.`})],r)}

    [[expl(d,a1),"Swapped. The first term stands alone, and d multiplies (n − 1)."],[`${an("n")} = ${fmt(a1)} ${d<0?"−":"+"} ${fmt(Math.abs(d))}n`,"Use (n − 1). Check n = 1."],[expl(a1,-d),"Keep the same sign as in the recursive rule."]],
    [stp(r,{p:"What does the recursive rule tell us?",good:`The first term is ${fmt(a1)} and we add ${fmt(d)} each time`,bad:[[`The first term is ${fmt(d)} and we add ${fmt(a1)}`,`${an(1)} is given first: ${fmt(a1)}.`],[`We multiply by ${fmt(d)} each time`,"The rule adds, not multiplies."]],a:`Use it: ${an(2)} = ?`,ans:a1+d}),
     stp(r,{p:"Now write it explicitly:",good:`${an("n")} = ${an(1)} + d(n − 1)`,bad:[[`${an("n")} = ${an("n−1")} + d`,"That's still recursive."],[`${an("n")} = d + ${an(1)}n`,"The pattern is a₁ + d(n − 1)."]],a:"Check with n = 2: what does your formula give?",ans:a1+d})],r);
  // torecursive from simplified explicit a_n = dn + c

G.a4_word=(r,o)=>{const v=o.v||pick(r,VARS.a4_word);
  if(v==="two"){const a1=int(r,-8,15),d=nz(r,2,9)*(r()<0.75?1:-1),p=int(r,2,6),q=p+int(r,3,8);const ap=a1+(p-1)*d,aq=a1+(q-1)*d;
    return item("a4_word","Challenge",`In an arithmetic sequence, ${an(p)} = ${fmt(ap)} and ${an(q)} = ${fmt(aq)}. What is ${an(1)}?`,fmt(a1),
      [[fmt(ap-p*d),`From term 1 to term ${p} there are ${p-1} steps, not ${p}.`],[fmt(d),"That's the common difference. Use it to go back to the first term."],[fmt(ap+(p-1)*d),"Going back toward term 1 means subtracting d."],[fmt(aq-q*d),`From term 1 to term ${q} there are ${q-1} steps.`]],
      [stp(r,{p:`How many steps (common differences) are there from ${an(p)} to ${an(q)}?`,good:`${q} − ${p} = ${q-p}`,bad:[[`${q} + ${p}`,"Count the gaps between the term numbers."],[`${q}`,`Start counting at term ${p}.`]],a:`d = (${fmt(aq)} − ${ap<0?"("+fmt(ap)+")":fmt(ap)}) ÷ ${q-p} = ?`,ans:d}),
       stp(r,{p:`Now go back from ${an(p)} to ${an(1)}. How?`,good:`Subtract d, ${p-1} times`,bad:[[`Subtract d, ${p} times`,`From term 1 to term ${p} is ${p-1} steps.`],[`Add d, ${p-1} times`,"Going back toward term 1 means subtracting."]],a:`${an(1)} = ${fmt(ap)} − ${p-1}(${fmt(d)}) = ?`,ans:a1})],r)}
  if(v==="when"){const s=pick(r,[20,25,35,40,50]),d=pick(r,[8,10,12,15]),n=int(r,9,24),T=s+(n-1)*d;
    return item("a4_word","Word",`Jada puts $${s} in her savings in week 1. Each week after that she adds $${d} more than the week before's total, so her savings are ${seqS(s,d,3)} In which week will her savings reach $${T}?`,`Week ${n}`,
      [[`Week ${n-1}`,`Solve n − 1 = ${n-1}, then add 1.`],[`Week ${n+1}`,"Check by plugging your week back into the formula."],[`Week ${Math.round(T/d)}`,`Subtract the starting $${s} first.`]],
      [stp(r,{p:"Write the explicit formula:",good:expl(s,d),bad:[[`${an("n")} = ${s} + ${d}n`,"Week 1 should give $"+s+"."],[expl(d,s),"Swapped."]],a:`Solve ${T} = ${s} + ${d}(n − 1). What is n − 1?`,ans:n-1})],r)}
  const c=pick(r,[["A theater has","seats in the first row, and each row has","more seats than the row before. How many seats are in row","seats"],["A stack of cups is","cm tall with 1 cup, and each extra cup adds","cm. How tall (in cm) is a stack of","cups"]]);
  const s=c[3]==="seats"?int(r,12,24):pick(r,[9,10,12]),d=c[3]==="seats"?int(r,2,4):pick(r,[1.5,2,2.5]),n=int(r,12,30),ans=RD(s+(n-1)*d);
  const q=c[3]==="seats"?`${c[0]} ${s} ${c[1]} ${fmt(d)} ${c[2]} ${n}?`:`${c[0]} ${s} ${c[1]} ${fmt(d)} ${c[2]} ${n} cups?`;
  return item("a4_word","Word",q,fmt(ans),[[fmt(RD(s+n*d)),`Row/cup 1 already has ${s}. Add d only ${n-1} times.`],[fmt(RD(n*d)),"Start from the first term."],[fmt(RD(s*n)),"Each step adds d. It doesn't repeat the first amount."]],
    [stp(r,{p:"What are a₁ and d?",good:`${an(1)} = ${fmt(s)}, d = ${fmt(d)}`,bad:[[`${an(1)} = ${fmt(d)}, d = ${fmt(s)}`,"The first amount is a₁. The amount added each time is d."],[`${an(1)} = 0, d = ${fmt(d)}`,`The first one already has ${fmt(s)}.`]],a:`${an(n)} = ${fmt(s)} + ${fmt(d)}(${n} − 1) = ?`,ans})],r)};

// ---------- 3-5 ----------
const CTX_CORR=[["the hours students study and their test scores","pos"],["a person's height and their arm span","pos"],["the outside temperature and the number of hot cocoas sold","neg"],["the number of absences and a student's grade","neg"],["a car's age and its value","neg"],["shoe size and favorite number","none"],["the number of pets a family has and the month they were born","none"],["the temperature and the number of ice cream cones sold","pos"],["the hours spent playing video games and the hours of sleep","neg"],["a person's birthday (day of the month) and their height","none"]];
const CN={pos:"Positive correlation",neg:"Negative correlation",none:"No correlation"};
const CW={pos:"As one goes up, the other tends to go up: positive.",neg:"As one goes up, the other tends to go down: negative.",none:"There's no trend, so there's no correlation."};
G.a5_corr=(r,o)=>{const v=o.v||pick(r,VARS.a5_corr);
  if(v==="context"){const [t,k]=pick(r,CTX_CORR);
    return item("a5_corr","Word",`What kind of correlation would you expect between ${t}?`,CN[k],["pos","neg","none"].filter(x=>x!==k).map(x=>[CN[x],CW[k]]),
      [stp(r,{p:"How do we decide?",good:"Ask: when the first goes up, does the second tend to go up, go down, or neither?",bad:[["Ask if one causes the other","Correlation is about the trend, not the cause."],["Ask which number is bigger","Size doesn't matter, only the trend."]],t:CW[k]})],r)}
  const k=pick(r,["pos","neg","none"]),st=v==="strength"&&k!=="none"?pick(r,["strong","weak"]):"strong";const d=makeScatter(r,k,st)||makeScatter(r,k,st);
  const ymax=Math.max(...d.pts.map(p=>p[1]));const fig=scat(d.pts,{xmax:10,ymax,xl:"x",yl:"y"});
  if(v==="strength"){const name=k==="none"?"No correlation":`${st==="strong"?"Strong":"Weak"} ${k==="pos"?"positive":"negative"} correlation`;
    const all=["Strong positive correlation","Weak positive correlation","Strong negative correlation","Weak negative correlation","No correlation"].filter(x=>x!==name);
    const why=x=>x==="No correlation"?"The points do follow a trend.":x.includes("positive")!==(k==="pos")?"Check the direction: read the trend from left to right.":"Check how tightly the points hug a line: close together is strong, spread out is weak.";
    return item("a5_corr","Challenge",`Describe the correlation shown in the scatter plot.${fig}`,name,shuffle(r,all).map(x=>[x,k==="none"?"The points don't follow an up or down trend.":why(x)]),
      [stp(r,{p:"Read the trend from left to right. Which way do the points go?",good:k==="pos"?"Up":k==="neg"?"Down":"Neither, they're scattered",bad:[[k==="pos"?"Down":"Up","Look from left to right."],[k==="none"?"Down":"Neither, they're scattered","Squint at the whole cloud of points."]],t:"Then: points packed close to a line = strong. Points spread out but still trending = weak."})],r)}
  return item("a5_corr","Basic",`What type of correlation does the scatter plot show?${fig}`,CN[k],["pos","neg","none"].filter(x=>x!==k).map(x=>[CN[x],CW[k]]),
    [stp(r,{p:"How do we read a scatter plot's trend?",good:"Look from left to right: do the points tend to rise, fall, or neither?",bad:[["Look at the highest point","One point doesn't show the trend."],["Count the points","The number of points doesn't decide the direction."]],t:CW[k]})],r)};

G.a5_fit=(r,o)=>{const v=o.v||pick(r,VARS.a5_fit);
  const C=pick(r,[["hours practiced","score"],["minutes of exercise","calories burned"],["years since 2015","price ($)"],["temperature (°F)","drinks sold"]]);
  if(v==="eq"){let x1,x2,m,b;do{x1=int(r,1,3);x2=int(r,7,10);m=pick(r,[2,3,4,5,6,2.5,1.5,-2,-3]);b=m>0?int(r,2,20):int(r,35,55)}while(m*x2+b<=2);const y1=RD(m*x1+b),y2=RD(m*x2+b);

function labEvents(){const out=[];

    st.rounds.forEach((R,ri)=>{let its=[];try{its=itemsFor(st,id,ri)}catch(e){}const when=new Date(R.finishedAt||st.updatedAt||Date.now()).toISOString().slice(0,10);
      its.forEach(it=>{const s=R.items[it.id];if(!s||!(s.status==="first"||s.status==="guided"))return;
        out.push({d:when,src:a.name+" · "+typeName(R,st),skill:it.skill,res:s.status==="first"?"first":"helped",q:plain(it.q),given:(s.wrong||[]).join(" · "),correct:plain(it.opts[it.ans]),lab:1})})})}

    const last=x.seq[x.seq.length-1],recent=x.seq.slice(-3);

  return S2}

function typedInput(id){return`<span class="typed"><input class="in" id="${id}" autocomplete="off" aria-label="answer" placeholder="e.g. 12, −3.5, 3/4"><span class="kpad"><button type="button" class="kb" data-ins="${id}" data-ch="−" title="Negative sign">−</button><button type="button" class="kb" data-ins="${id}" data-ch="/" title="Fraction bar">/</button></span></span>`}

function render(){
  const R=round(),its=items();
  document.getElementById("weekTitle").textContent=assessTitle(A());
  renderPrep();
  // stage bar

  else document.getElementById("stages").innerHTML=`<div class="stage ${stage===1?"now":mainDone?"done":""}"><b>1</b> ${CUR==="T2-Q2"?"Chapter set":"First test"}</div><div class="stage ${stage===2?"now":anyTest?"done":""}"><b>2</b> Strengthen</div><div class="stage ${stage===3?"now":""} ${S.proficient?"done":""}"><b>3</b> Timed tests <span class="streak" title="Perfect timed tests in a row">${dots}</span></div>`;
  // round header
  const st=roundStats(S.cur.r);const solvedN=its.filter(it=>solved(ist(it.id))).length;
  let rh=`<div><div class="rtitle">${typeName(R)}</div><div class="rsub">${R.type==="main"&&isMid()?`${A().first} questions covering every skill in lessons ${A().span}, to find what still needs work${its.some(x=>x.lvl==="Re-test")?", plus re-test questions (R) on earlier weak spots":""}`:R.type==="test"&&isMid()?`A full practice test laid out like ${A().teacher} (${A().n} questions, new numbers every time). The clock is for her reference (about ${A().min} minutes). Goal: 100% on ${need()} tests in a row.`:R.type==="main"?(CUR==="T2-Q2"?"Chapter questions plus re-test questions from Unit 1":`${A().n} questions on ${A().kind==="cumulative"?"everything so far":"lessons "+A().lessons.join(", ")}${its.some(x=>x.lvl==="Re-test")?", plus re-test questions (R) on earlier weak spots":""}`):R.type==="strengthen"?"10 new questions on: "+R.skills.map(k=>SK[k]).join(", "):`${A().n} questions on this ${A().kind==="quiz"?"quiz":"test"}'s lessons only. Aim to finish within ${A().min} minutes.`}</div></div>`;
  rh+=`<div class="rnums"><span><b>${solvedN}</b>/${its.length} done</span><span><b>${st.first}</b> right first try</span>${R.type==="test"?`<span class="timer ${!R.finishedAt&&(Date.now()-R.startedAt)/1000>A().min*60?"over":""}" id="timer">⏱ ${mmss(((R.finishedAt||Date.now())-R.startedAt)/1000)} / ${A().min}:00</span>`:""}</div>`;
  document.getElementById("rhead").innerHTML=rh;
  const done=roundDone();
  document.getElementById("dots").innerHTML=its.map((it,i)=>`<button class="dot ${ist(it.id).status} ${i===S.cur.q?"cur":""}" data-go="${i}" aria-label="Question ${it.label}">${it.label}</button>`).join("")+(done?`<button class="dot sum ${S.cur.q==="summary"?"cur":""}" data-go="summary">Summary</button>`:"")+(S.rounds.length>1?`<button class="dot sum" data-history="1">Earlier rounds</button>`:"");
  if(S.cur.q==="summary")renderSummary();else renderCard();
  document.getElementById("prev").disabled=S.cur.q==="summary"||S.cur.q===0;
  document.getElementById("next").disabled=S.cur.q==="summary"||S.cur.q===its.length-1;
  document.getElementById("nav").hidden=S.cur.q==="summary";
  clearInterval(timerId);if(R.type==="test"&&!R.finishedAt)timerId=setInterval(()=>{const el=document.getElementById("timer");if(el){const sec=(Date.now()-R.startedAt)/1000;el.textContent=`⏱ ${mmss(sec)} / ${A().min}:00`;el.classList.toggle("over",sec>A().min*60)}},1000);
}

function renderCard(){
  const it=items()[S.cur.q],s=ist(it.id),f=flash[it.id];
  let h=`<div class="meta"><span class="qnum">${it.label}</span><span class="pill ${it.lvl}">${it.lvl==="Word"?"Word problem":it.lvl}</span><span>${SK[it.skill]}${LESSON[it.skill]?" · Lesson "+LESSON[it.skill]:""}</span></div><p class="q">${it.q}</p>`;
  if(!solved(s)){const locked=s.guide&&s.step<it.steps.length;h+=optButtons(it.opts,"main",locked?it.opts.map((_,i)=>i):s.picks);h+=`<p class="howto">${locked?"🔒 Choices are locked until you finish the steps below.":"Tap your answer."}</p>`}
  if(f)h+=`<div class="fb ${f.cls}">${f.text}</div>`;
  if(solved(s))h+=`<div class="fb ok"><b>${s.status==="first"?"Solved on the first try.":"Solved using the steps."}</b> Answer: ${s.final}</div>`;
  if(s.guide&&it.steps.length){
    h+=`<div class="guide"><h3>Let's work it out together</h3><p class="note">Work through each step. Where there are choices, first pick what to do next, then do it.</p>`;
    it.steps.forEach((stp,i)=>{if(i>s.step)return;const done=i<s.step,planned=!stp.po.length||!!s.sp[i]||done;
      h+=`<div class="step ${done?"done":""}"><span class="lab">Step ${i+1} of ${it.steps.length}</span>`;
      if(!planned){h+=`<p class="ask">${stp.p}</p>`+optButtons(stp.po,"p"+i,s.pp[i],"opt plan");
        const last=(s.pp[i]||[]).slice(-1)[0];if(last!=null&&stp.pw[last])h+=`<div class="fb tip"><b>Not quite.</b> ${stp.pw[last]}</div>`}
      else{if(stp.po.length)h+=`<p class="decided">✓ ${stp.po[stp.pa]}</p>`;if(stp.t)h+=`<p class="teach"><span class="whylab">Why:</span> ${stp.t}</p>`;
        if(stp.a){h+=`<p class="ask">${stp.a}</p>`;
          if(done){const rv=s.revealed.includes(i);h+=`<p class="why">✓ ${rv?"This step's answer: ":""}<b>${stp.kind==="choice"?stp.opts[stp.ans]:fmt(stp.ans)}</b></p>`}
          else{if(stp.kind==="choice")h+=optButtons(stp.opts,"s"+i,[]);else{h+=`<p class="howto">Type a number, decimal or fraction like 3/4.</p><div class="answer">${typedInput("s"+i)}<button class="btn" data-checkstep="${i}">Check step</button></div>`}
            const m=s.miss[i]||0;if(m===1)h+=`<div class="fb tip"><b>Hint:</b> ${stp.h}</div>`;if(m>=2)h+=`<div class="fb tip"><b>Hint:</b> ${stp.h} One more try. If it's still stuck, the next check shows this step so you can keep going.</div>`}}}
      h+=`</div>`});
    if(s.step>=it.steps.length&&!solved(s))h+=`<div class="fb ok"><b>All steps done.</b> Now use what you worked out to pick the answer at the top.</div>`;
    h+=`</div>`}
  if(solved(s)){const its=items();const nextOpen=its.findIndex((x,i)=>i>S.cur.q&&!solved(ist(x.id)));const anyOpen=its.findIndex(x=>!solved(ist(x.id)));
    if(roundDone())h+=`<div><button class="btn" data-go="summary">See my summary →</button></div>`;
    else h+=`<div><button class="btn" data-go="${nextOpen>=0?nextOpen:anyOpen}">Next question →</button></div>`}
  document.getElementById("card").innerHTML=h;
  if(f!==undefined){const inp=document.querySelector(".step:not(.done) input.in");if(inp)inp.focus({preventScroll:true})}
}

function renderSummary(){
  const i=S.cur.r,R=round(i),st=roundStats(i);const pct=Math.round(st.first/st.n*100);
  let h=`<div class="sumtop"><div class="big">${st.first}<span>/${st.n}</span></div><div><div class="rtitle">${typeName(R)} complete</div><div class="rsub">${pct}% right on the first try${R.type==="test"&&st.dur!=null?` · finished in ${mmss(st.dur)} ${st.dur<=A().min*60?"(within "+A().min+" min ✓)":"(over "+A().min+" min)"}`:""}</div></div></div>`;
  h+=`<div class="tbl"><table><thead><tr><th>Skill</th><th>First try</th><th>With steps</th><th></th></tr></thead><tbody>${Object.entries(st.per).map(([k,p])=>`<tr><td>${SK[k]}</td><td>${p.first}/${p.n}</td><td>${p.help}</td><td class="st ${p.first===p.n?"first":"guided"}">${p.first===p.n?"Solid":"Practice"}</td></tr>`).join("")}</tbody></table></div>`;
  const last=i===S.rounds.length-1;
  if(!last){h+=`<p class="note">This is an earlier round. <button class="linkbtn" data-goround="${S.rounds.length-1}">Go to the current round →</button></p>`;document.getElementById("card").innerHTML=h;return}
  const chapterMissed=st.missed.filter(k=>skillsOf(A().lessons).includes(k));
  if(isMid()){const SN=A().strNeed,ss=S.sstreak||0;
    if(R.type==="test"){
      if(S.proficient)h+=`<div class="fb ok"><b>Ready for the ${A().card.replace(" prep","").toLowerCase()}!</b> ${need()} perfect practice tests in a row.</div><div class="actions"><button class="btn ghost" data-start="test">Take another practice test anyway</button></div>`;
      else if(st.perfect)h+=`<div class="fb ok"><b>100% on the practice test!</b> That's ${S.streak} of ${need()} in a row. One more perfect test and she's ready.</div><div class="actions"><button class="btn" data-start="test">Start practice test ${S.rounds.filter(x=>x.type==="test").length+1} →</button></div>`;
      else h+=`<div class="fb tip"><b>Not 100% yet, so the practice-test streak starts again.</b> Let's strengthen: ${chapterMissed.map(k=>SK[k]).join(", ")}. She needs ${SN} passing 10-question rounds in a row before the next practice test (100%, or 90% from round ${STR_RELAX_AFTER+1} on).</div><div class="actions"><button class="btn" data-start="strengthen">Practice these skills (10 questions) →</button></div>`;
    }else if(R.type==="main"&&st.perfect){
      h+=`<div class="fb ok"><b>Every question right on the first try!</b> She can go straight to the full practice test (laid out like ${A().teacher}). Goal: 100% on ${need()} in a row.</div><div class="actions"><button class="btn" data-start="test">Start practice test 1 →</button></div>`;
    }else if(R.type==="strengthen"&&strPass(i)&&ss<SN){
      h+=`<div class="fb ok"><b>${st.perfect?"100% on this round!":`${st.first}/${st.n}. That passes (90% counts after ${STR_RELAX_AFTER} rounds)!`}</b> That's ${ss} of ${SN} perfect rounds in a row. One more 10-question round on ${(R.base||R.skills).map(k=>SK[k]).join(", ")} to lock it in.</div><div class="actions"><button class="btn" data-start="again">Next 10-question round →</button></div>`;
    }else if(R.type==="strengthen"&&strPass(i)){
      h+=`<div class="fb ok"><b>${SN} passing rounds in a row!</b> Now the full practice test, laid out like ${A().teacher} (${A().n} questions). Goal: 100% on ${need()} practice tests in a row.</div><div class="actions"><button class="btn" data-start="test">Start practice test ${S.rounds.filter(x=>x.type==="test").length+1} →</button></div>`;
    }else if(!chapterMissed.length){
      h+=`<div class="fb ok"><b>Every ${A().name} question was right on the first try.</b> The only misses were review questions from earlier topics (${st.missed.map(k=>SK[k]).join(", ")}). Those don't hold up mid-chapter prep, so next is the full practice test.</div><div class="actions"><button class="btn" data-start="test">Start practice test ${S.rounds.filter(x=>x.type==="test").length+1} →</button></div>`;
    }else{
      h+=`<div class="fb tip"><b>${R.type==="main"?"Here's what still needs work":"Almost there. Let's keep strengthening"}:</b> ${chapterMissed.map(k=>SK[k]).join(", ")}.${chapterMissed.length<st.missed.length?" (Review questions from earlier topics are left out of these rounds.)":""} Next is a 10-question round with new numbers on just these skills. She needs ${SN} passing rounds in a row before the full practice test (100%, or 90% from round ${STR_RELAX_AFTER+1} on).</div><div class="actions"><button class="btn" data-start="strengthen">Practice these skills (10 questions) →</button></div>`;
    }
    document.getElementById("card").innerHTML=h;return}
  if(R.type==="test"){
    const counted=st.perfect&&st.dur<=A().min*60;
    if(S.proficient)h+=`<div class="fb ok big"><b>Chapter mastered!</b> ${need()} perfect timed tests in a row. She's ready for the class test.</div><div class="actions"><button class="btn ghost" data-start="test">Take another timed test anyway</button></div>`;
    else if(counted)h+=`<div class="fb ok"><b>Perfect test!</b> That's ${S.streak} of ${need()} in a row.</div><div class="actions"><button class="btn" data-start="test">Start timed test ${S.rounds.filter(x=>x.type==="test").length+1} →</button></div>`;
    else if(st.perfect)h+=`<div class="fb tip"><b>100%, but it took ${mmss(st.dur)}.</b> To count toward the ${need()}-in-a-row goal, a perfect test has to be finished within ${A().min} minutes. The streak starts again.</div><div class="actions"><button class="btn" data-start="test">Try another timed test →</button></div>`;
    else h+=`<div class="fb tip"><b>Not perfect yet, so the streak starts again.</b> Let's strengthen: ${chapterMissed.map(k=>SK[k]).join(", ")}.</div><div class="actions"><button class="btn" data-start="strengthen">Practice these skills (10 questions) →</button><button class="btn ghost" data-start="test">Take another test instead</button></div>`;
  }else if(st.perfect||strPass(i)){
    h+=`<div class="fb ok"><b>${R.type==="main"?"Every question right on the first try!":st.perfect?"100% on this round. Those skills are stronger now.":`${st.first}/${st.n}. That passes (90% counts after ${STR_RELAX_AFTER} rounds).`}</b> Next: a timed test with ${A().n} new questions on these lessons. Aim to finish within ${A().min} minutes. You need ${need()} perfect tests in a row.</div><div class="actions"><button class="btn" data-start="test">Start timed test →</button></div>`;
  }else{
    h+=`<div class="fb tip"><b>Let's strengthen what wasn't right on the first try:</b> ${st.missed.map(k=>SK[k]).join(", ")}. You'll get 10 new questions with different numbers and styles. Keep going until you get them all right on the first try (from round ${STR_RELAX_AFTER+1} on, 90% is enough).</div><div class="actions"><button class="btn" data-start="strengthen">Practice these skills (10 questions) →</button></div>`;
  }
  document.getElementById("card").innerHTML=h;
}

// ---------- actions ----------
function finishRoundIfDone(){const R=round();if(R.finishedAt||!roundDone())return;R.finishedAt=Date.now();const st=roundStats(S.cur.r);
  if(R.type==="test"){if(st.perfect&&(A().timeRef||st.dur<=A().min*60)){S.streak++;S.best=Math.max(S.best,S.streak);if(S.streak>=need())S.proficient=true}else{S.streak=0}}
  if(R.type==="strengthen"){S.sstreak=strPass(S.cur.r)?(S.sstreak||0)+1:0}else S.sstreak=0;
  if(db){db.doc(`rounds/${storeKey(CUR)}_${R.no}`).set({week:storeKey(CUR),assessment:CUR,no:R.no,type:R.type,name:typeName(R),first:st.first,total:st.n,missed:st.missed,durationSec:st.dur,streakAfter:S.streak,finishedAt:new Date(R.finishedAt).toISOString()}).catch(()=>{})}}
function startRound(type){const prev=round(S.rounds.length-1),st=roundStats(S.rounds.length-1);let base=null,again=null;
  if(type==="again"){type="strengthen";again=(prev.base||prev.skills||[]).slice()}
  let skills=type==="strengthen"?(again||st.missed.slice()):null;if(type==="strengthen")base=again||(prev.type==="strengthen"?(prev.base||prev.skills):skills.slice());if(type==="strengthen"&&(prev.type==="test"||isMid()))skills=skills.filter(k=>skillsOf(A().lessons).includes(k));if(type==="strengthen"&&!skills.length)type="test";
  const no=S.rounds.length;const R={no,type,startedAt:Date.now(),items:{}};if(type==="strengthen"){R.skills=skills;R.base=(base||skills).filter(k=>G[k]&&(!isMid()||skillsOf(A().lessons).includes(k)));R.specs=strengthenSpecs(skills,no)}else R.specs=isMid()?midTestSpecs(CUR,no):pickSpecs(A().lessons,A().n,no,"test");
  S.rounds.push(R);S.cur={r:no,q:0};flash={};save();render();window.scrollTo({top:0,behavior:"smooth"})}

function pickMain(i){const it=items()[S.cur.q],s=ist(it.id);if(solved(s)||s.picks.includes(i))return;if(s.guide&&s.step<it.steps.length){flash[it.id]={cls:"tip",text:"<b>Finish the steps below first.</b> The answer choices unlock when the last step is done."};render();return}s.tries++;
  if(i===it.ans){s.status=s.tries===1?"first":"guided";s.final=it.opts[i];flash[it.id]={cls:"ok",text:`<b>${rpick(PRAISE)}</b>${s.status==="guided"?" Working through it step by step paid off.":""}`};finishRoundIfDone()}
  else{s.picks.push(i);s.status="working";s.wrong.push(plain(it.opts[i]));const ww=it.ww[i]?it.ww[i]+" ":"";
    if(!s.guide){s.guide=true;flash[it.id]={cls:"no",text:`<b>Not yet.</b> ${ww}Let's work through it one step at a time below. Come back and pick an answer whenever you're ready.`}}
    else flash[it.id]={cls:"no",text:`<b>Not yet.</b> ${ww}${s.step<it.steps.length?"Finish the next step below first. It leads to the answer.":"Look back at what each step gave you and put those pieces together."}`}}
  save();syncResult(it,s);render()}
function pickPlan(i,k){const it=items()[S.cur.q],s=ist(it.id),stp=it.steps[i];const pp=s.pp[i]||(s.pp[i]=[]);if(pp.includes(k))return;
  if(k===stp.pa){s.sp[i]=true;if(!stp.a)s.step=i+1;flash[it.id]=undefined}else{pp.push(k)}save();render()}
function checkStep(i,val){const it=items()[S.cur.q],s=ist(it.id),stp=it.steps[i];let ok;
  if(stp.kind==="choice")ok=val===stp.ans;else{const v=num(val);if(isNaN(v)){flash[it.id]={cls:"tip",text:"Type a number, a decimal, or a fraction like 3/4."};return render()}ok=near(v,stp.ans,stp.tol)}
  if(ok){s.step=i+1;flash[it.id]=undefined}else{s.miss[i]=(s.miss[i]||0)+1;if(s.miss[i]>=3){s.revealed.push(i);s.step=i+1;flash[it.id]={cls:"tip",text:"Here's that step so you can keep going. Read why it works, then try the next step."}}else flash[it.id]=undefined}
  save();render()}
async function syncResult(it,s){if(!db||round().type!=="main"||CUR!=="T2-Q2")return;const WEEK="oct26";try{await db.doc(`results/${WEEK}_${it.id}`).set({week:WEEK,qid:it.id,status:s.status,tries:s.tries,wrong:s.wrong,stepsDone:s.step,stepsRevealed:s.revealed.length,final:s.final||"",updatedAt:new Date().toISOString()})}catch(e){}}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.go!==undefined){S.cur.q=d.go==="summary"?"summary":+d.go;flash={};save(false);render();if(d.go==="summary"||t.classList.contains("btn"))window.scrollTo({top:0,behavior:"smooth"});return}
  if(d.goround!==undefined){S.cur={r:+d.goround,q:roundDone(+d.goround)?"summary":0};render();return}
  if(d.history){showHistory();return}
  if(t.id==="prev"&&S.cur.q>0){S.cur.q--;flash={};render();return}
  if(t.id==="next"&&S.cur.q<items().length-1){S.cur.q++;flash={};render();return}
  if(d.start){startRound(d.start);return}
  if(d.copyres){const lines=[`${A().name} — Aviaana's Math Lab results (copied ${new Date().toLocaleString()})`];S.rounds.forEach((R,i)=>{const x=roundStats(i);lines.push(`${typeName(R)}: ${R.finishedAt?x.first+"/"+x.n:R.skipped?"skipped by parent":"in progress"}${R.finishedAt&&R.startedAt?` in ${Math.round((R.finishedAt-R.startedAt)/60000)} min`:""}${R.finishedAt&&x.missed.length?" · missed: "+x.missed.map(k=>SK[k]||k).join(", "):""}`)});lines.push(`Practice-test streak: ${S.streak}/${need()}${S.proficient?" (ready)":""}`);
    const t=lines.join("\n"),m=document.getElementById("cmsg");try{navigator.clipboard.writeText(t).then(()=>{if(m)m.innerHTML=`<div class="fb ok">Copied. Paste it into Claude.</div>`},()=>{if(m)m.innerHTML=`<textarea class="in" style="width:100%;height:160px">${t}</textarea>`})}catch(e){if(m)m.innerHTML=`<textarea class="in" style="width:100%;height:160px">${t}</textarea>`}return}
  if(d.override){const c=(document.getElementById("pcode")||{}).value||"";const m=document.getElementById("pmsg");if(hash(c.trim().toUpperCase())!==PCODE&&!(PCH&&c.trim()!==""&&Number(c.trim().replace(/[−–]/g,"-"))===PCH.ans)){if(m)m.innerHTML=`<div class="fb no">That code isn't right.</div>`;return}PCH=null;parentSkip(d.override);return}
  if(d.sup){const on=t.getAttribute("aria-pressed")!=="true";t.setAttribute("aria-pressed",String(on));const inp=document.getElementById(d.sup);if(inp){inp.dataset.supmode=on?"1":"0";inp.classList.toggle("supmode",on);inp.focus()}return}
  if(d.ins){const inp=document.getElementById(d.ins);if(inp){const ch=inp.dataset.supmode==="1"&&d.ch==="−"?"⁻":d.ch;const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??a;inp.setRangeText(ch,a,b,"end");inp.focus()}return}
  if(d.checkstep!==undefined){const i=+d.checkstep;checkStep(i,(document.getElementById("s"+i)||{}).value||"");return}
  if(d.pick){const k=+d.i;if(d.pick==="main")pickMain(k);else if(d.pick[0]==="p")pickPlan(+d.pick.slice(1),k);else checkStep(+d.pick.slice(1),k);return}
  if(t.id==="tabPractice"||t.id==="tabParent"||t.id==="tabCourse"||t.id==="tabReview"){showTab(t.id);return}
  if(d.open){open(d.open);showTab("tabPractice");render();window.scrollTo({top:0});return}
  if(d.cum){const sel=document.getElementById("cumSel");if(sel){open("CUM-"+sel.value);showTab("tabPractice");render();window.scrollTo({top:0})}return}
});
const SUPMAP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻","−":"⁻"};
document.addEventListener("beforeinput",e=>{const t=e.target;if(!t.matches||!t.matches("input.in")||t.dataset.supmode!=="1"||e.inputType!=="insertText"||!e.data)return;
  const out=[...e.data].map(c=>SUPMAP[c]||c).join("");if(out===e.data)return;e.preventDefault();const a=t.selectionStart??t.value.length,b=t.selectionEnd??a;t.setRangeText(out,a,b,"end")});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||!e.target.matches("input.in"))return;e.target.closest(".step")?.querySelector("[data-checkstep]")?.click()});

function parentSkip(to){const last=S.rounds.length-1,R=round(last);if(!R.finishedAt){R.skipped=true;R.skippedAt=Date.now()}
  (S.overrides=S.overrides||[]).push({at:Date.now(),from:R.type,round:last,to});
  if(to==="ready"){S.proficient=true;S.streak=Math.max(S.streak,need());S.cur={r:last,q:roundDone(last)?"summary":0};save();showTab("tabPractice");render();return}
  S.sstreak=0;if(to==="strengthen"&&R.type==="strengthen"&&!R.finishedAt){R.finishedAt=null}
  startRound(to);showTab("tabPractice");render()}
function showHistory(){let h=`<div class="rtitle">All rounds</div><div class="tbl"><table><thead><tr><th>Round</th><th>Score</th><th>Time</th><th></th></tr></thead><tbody>`;
  S.rounds.forEach((R,i)=>{const st=roundStats(i);h+=`<tr><td>${typeName(R)}</td><td>${R.finishedAt?st.first+"/"+st.n:R.skipped?"skipped by parent":"in progress"}</td><td>${R.type==="test"&&st.dur!=null?mmss(st.dur):"—"}</td><td><button class="linkbtn" data-goround="${i}">Open</button></td></tr>`});
  document.getElementById("card").innerHTML=h+`</tbody></table></div>`;document.getElementById("nav").hidden=true}

function renderParent(){
  let h=`<h3 class="rtitle">Course progress</h3><div class="tbl"><table><thead><tr><th>Quiz / test</th><th>Status</th><th>Rounds</th><th>Last score</th></tr></thead><tbody>${ASSESS.filter(a=>STORE[a.id]).map(a=>{const st=STORE[a.id],s=statusOf(a.id);const fin=st.rounds.map((R,i)=>[R,i]).filter(x=>x[0].finishedAt).pop();const ls=fin?roundStats(fin[1],st,a.id):null;return`<tr><td>${a.name}</td><td class="st ${s.cls}">${s.txt}</td><td>${st.rounds.length}</td><td>${ls?ls.first+"/"+ls.n:"—"}</td></tr>`}).join("")||`<tr><td colspan="4">Nothing started yet.</td></tr>`}</tbody></table></div><h3 class="rtitle">${A().name}</h3>
  <div class="score"><span>Stage: <b>${S.proficient?"Mastered":round(S.rounds.length-1).type==="main"?(isMid()?"Assessment test":"Chapter set"):round(S.rounds.length-1).type==="strengthen"?"Strengthening":"Timed tests"}</b></span><span>Perfect ${isMid()?"practice":"timed"} tests in a row: <b>${S.streak}</b>/${need()}</span><span>Best streak: <b>${S.best}</b></span></div>
  <div class="tbl"><table><thead><tr><th>Round</th><th>First try</th><th>%</th><th>Time</th><th>Skills missed</th></tr></thead><tbody>`;
  S.rounds.forEach((R,i)=>{const st=roundStats(i);h+=`<tr><td>${typeName(R)}</td><td>${R.finishedAt?st.first+"/"+st.n:(R.skipped?"skipped by parent (":"in progress (")+items(i).filter(it=>solved(ist(it.id,R))).length+"/"+st.n+" done)"}</td><td>${R.finishedAt?Math.round(st.first/st.n*100)+"%":"—"}</td><td>${R.type==="test"&&st.dur!=null?mmss(st.dur)+(st.dur>A().min*60?" ⚠":""):"—"}</td><td>${st.missed.map(k=>SK[k]).join(", ")||(R.finishedAt?"None":"—")}</td></tr>`});
  h+=`</tbody></table></div><h3 class="rtitle" style="font-size:17px">Questions in ${typeName(round())}</h3><div class="tbl"><table><thead><tr><th>Q</th><th>Skill</th><th>Result</th><th>Tries</th><th>Wrong answers picked</th><th>Steps shown</th></tr></thead><tbody>`;
  const lab={first:"Right first try",guided:"Solved with steps",working:"Still working",new:"Not started"};
  items().forEach(it=>{const s=ist(it.id);h+=`<tr><td><b>${it.label}</b></td><td>${SK[it.skill]}</td><td class="st ${s.status}">${lab[s.status]}</td><td>${s.tries||0}</td><td>${(s.wrong||[]).join(" · ")||"—"}</td><td>${(s.revealed||[]).length}</td></tr>`});
  h+=`</tbody></table></div><p class="note">${SYNC.mode==="claude"?"Progress is saved to this page, so it carries across devices and Claude can read it to plan next week.":SYNC.mode==="web"?(SYNC.err?"⚠ Couldn't reach the sync service just now ("+SYNC.err+"). Progress is saved on this browser and will sync when it's back.":"Progress syncs online, so it carries over to any browser"+(SYNC.last?" (last synced "+new Date(SYNC.last).toLocaleTimeString()+")":"")+"."):"Progress is saved on this browser only (online sync isn't set up yet)."} “Steps shown” counts steps where she missed three times and the page showed that step.</p>`;
  const mid=isMid(),T3=mid?"practice tests":"timed tests";
  h+=`<div class="card override"><h3 class="rtitle" style="font-size:17px">Parent override</h3><p class="note">Move ${A().name} to a later step without finishing the current one. This needs the parent code.${(S.overrides||[]).length?` Used ${(S.overrides||[]).length} time(s) here: ${(S.overrides||[]).map(o=>o.to+" ("+new Date(o.at).toLocaleDateString()+")").join(", ")}.`:""}</p>
  <p class="note">Type the parent code, <b>or</b> answer this parent check: ${(PCH||newPCH(),PCH).q}</p><div class="answer"><input class="in" id="pcode" type="password" autocomplete="off" placeholder="Code or answer" aria-label="Parent code or answer"></div>
  <div class="actions"><button class="btn ghost" data-override="strengthen">Skip to 10-question rounds</button><button class="btn ghost" data-override="test">Skip to ${T3}</button><button class="btn ghost" data-override="ready">Mark as ${mid?"ready":"mastered"}</button></div><div id="pmsg"></div></div>`;
  h+=`<div class="card"><h3 class="rtitle" style="font-size:17px">Send results to Claude</h3><p class="note">Copies a short summary of every round in ${A().name} so you can paste it into Claude.</p><div class="actions"><button class="btn ghost" data-copyres="1">Copy results</button></div><div id="cmsg"></div></div>`;h+=extraParentHTML();
  document.getElementById("parent").innerHTML=h}
function showTab(id){const map={tabPractice:"practice",tabCourse:"course",tabReview:"review",tabParent:"parent"};for(const k in map){const on=k===id;document.getElementById(map[k]).hidden=!on;document.getElementById(k).setAttribute("aria-pressed",String(on))}
  document.getElementById("stages").hidden=id!=="tabPractice";if(id!=="tabPractice")document.getElementById("prep").hidden=true;else renderPrep();if(id==="tabParent"){PCH=null;renderParent()}if(id==="tabCourse")renderCourse();if(id==="tabReview")renderReview()}
function statusOf(id){const st=STORE[id];if(!st||!st.rounds)return{cls:"new",txt:"Not started"};
  const dots=Array.from({length:needOf(id)},(_,i)=>`<span class="sdot ${i<st.streak?"on":""}"></span>`).join("");const mid=(AM(id)||{}).kind==="mid";
  if(st.proficient)return{cls:"first",txt:`${mid?"Ready":"Mastered"} <span class="streak">${dots}</span>`};
  const R=st.rounds[st.rounds.length-1];const its=itemsFor(st,id,st.rounds.length-1);const done=its.filter(it=>{const s=R.items[it.id];return s&&(s.status==="first"||s.status==="guided")}).length;
  if(R.type==="main")return done===its.length?{cls:"guided",txt:"Done · summary ready"}:{cls:"working",txt:`${id==="T2-Q2"?"Chapter set":mid?"Assessment":"First test"} ${done}/${its.length}`};
  if(R.type==="strengthen")return{cls:"guided",txt:mid?`10-question rounds (${st.sstreak||0}/${(AM(id)||{}).strNeed} at 100%)`:"Strengthening"};
  return{cls:"guided",txt:`${mid?"Practice tests":"Timed tests"} <span class="streak">${dots}</span>`}}
function renderCourse(){
  let h=`<div class="rtitle">All quizzes &amp; tests</div><p class="note">enVision Algebra 1, class “7th Algebra Yellow”. Each quiz runs the same way: an assessment test on every skill, then 10-question rounds on what she missed, then full practice tests until she gets 100% twice in a row.</p>`;
  for(const T of COURSE){const as=ASSESS.filter(a=>a.topic===T.t);
    h+=`<section class="topic"><div class="thead"><span class="tnum">Topic ${T.t}</span><span class="tname">${T.name}</span>${T.done?'<span class="pill">Done</span>':""}</div>
    <details${as.length?" open":""}><summary>${T.lessons.length} lessons</summary><ul class="lessons">${T.lessons.map(l=>`<li><b>${l[0]}</b> ${l[1]}</li>`).join("")}</ul></details>
    ${T.link?`<p class="note">Earlier practice: <a href="${T.link}" target="_blank" rel="noopener">${T.linkName}</a></p>`:""}
    <div class="arow">${as.map(a=>{const s=statusOf(a.id);return`<button class="acard ${a.id===CUR?"cur":""}" data-open="${a.id}"><span class="aname">${a.card||a.name}</span><span class="ales">${a.span||a.lessons.join(", ")}</span><span class="st ${s.cls}">${s.txt}</span></button>`}).join("")}</div>
    ${!as.length&&!T.done?'<p class="note">Coming when the class gets here.</p>':""}</section>`}
  document.getElementById("course").innerHTML=h}

// ---------- Test prep panel: follows the newest prep assessment (Topic 3 Chapter Test, Fri Nov 13 2026) ----------
const PREP_ID="T3-QZ";
function midInfo(){const st=STORE[PREP_ID];const R=(st&&st.rounds)||[];
  const firstPerfect=!!(R[0]&&R[0].finishedAt&&roundStats(0,st,PREP_ID).perfect);
  return{firstDone:!!(R[0]&&R[0].finishedAt),strDone:R.some(x=>x.type==="test")||firstPerfect||!!(st&&(st.sstreak||0)>=2),test1:!!(st&&(st.streak>=1||st.proficient)),ready:!!(st&&st.proficient)}}
function prepSteps(){const a=AM(PREP_ID);return[
 {goal:`Assessment test: ${a.first} questions on every ${a.span} skill, to see what still needs work`,done:i=>i.firstDone},
 {goal:"10-question rounds on the missed skills until she passes 2 rounds in a row (100%, or 90% from the 3rd round on)",done:i=>i.strDone},
 {goal:`Full practice test (${a.n} questions): first 100%`,done:i=>i.test1},
 {goal:`Second 100% practice test in a row = ready for the quiz`,done:i=>i.ready}]}
function fin(id,pred){const st=STORE[id];return !!(st&&st.rounds&&st.rounds.some(R=>R.finishedAt&&pred(R)))}
function todayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function renderPrep(){const el=document.getElementById("prep");if(!el)return;const a=AM(PREP_ID),i=midInfo();if(i.ready&&CUR!==PREP_ID){el.hidden=true;return}el.hidden=false;const steps=prepSteps(),cur=steps.findIndex(x=>!x.done(i));
  const dl=a.date?new Date(a.date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}):"this week";
  el.innerHTML=`<div class="prephead"><span class="tnum">${a.name} prep</span><span class="tname">Lessons ${a.span} · quiz ${dl}</span></div><ol class="plan">${steps.map((d,k)=>{const done=d.done(i),now=k===cur;
    return`<li class="${done?"done":now?"now":""}"><span class="pday">Step ${k+1}</span><span class="pgoal">${d.goal}</span><span class="pact">${done?"✓ Done":now?(CUR===PREP_ID?"← now":`<button class="btn sm" data-open="${PREP_ID}">Start</button>`):""}</span></li>`}).join("")}</ol>`}

loadLocal();loadDynLocal();open(CUR);render();
// ---------- progress sync on any browser (Cloudflare Worker; used when the page isn't running inside Claude) ----------
const SYNC_URL_DEFAULT="https://avi-math-sync.mrnarang.workers.dev";// set after the Worker is deployed, e.g. "https://avi-math-sync.<name>.workers.dev"
function syncUrl(){try{return(localStorage.getItem("avlab:syncurl")||SYNC_URL_DEFAULT).replace(/\/+$/,"")}catch(e){return SYNC_URL_DEFAULT}}
let SYNC={mode:"local",last:null,err:null};
function remoteDb(base){
  const req=async(method,path,body)=>{const r=await fetch(base+path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});
    if(r.status===409)return r.json();if(!r.ok)throw new Error("sync "+r.status);SYNC.last=Date.now();SYNC.err=null;return r.json()};
  return{collection:name=>({get:async()=>{const rows=await req("GET","/c/"+name);return{docs:rows.map(x=>({id:x.id,data:()=>x.data}))}}}),
    doc:path=>({set:async obj=>{const [c,id]=path.split("/");try{return await req("PUT","/d/"+c+"/"+encodeURIComponent(id),obj)}catch(e){SYNC.err=String(e.message||e);throw e}}})}}
// a state she hasn't touched yet (fresh browser) never replaces saved progress
function untouched(st){return!st||!st.rounds||(st.rounds.length===1&&!Object.values(st.rounds[0].items||{}).some(x=>x&&x.tries))}
async function pullProgress(){if(!db)return false;let changed=false;
  const snap=await db.collection("progress").get();const seen=new Set();
  snap.docs.forEach(d=>{const v=d.data();if(!v||!v.json)return;let st;try{st=JSON.parse(v.json)}catch(e){return}const id=v.id||d.id;if(!AM(id))return;st.id=id;seen.add(id);
    const loc=STORE[id];if(!loc||untouched(loc)&&!untouched(st)||(v.updatedAt||0)>(loc.updatedAt||0)){STORE[id]=st;lsSet("avlab2:"+storeKey(id),st);changed=true}});
  // push anything this browser has that's newer than what's saved
  for(const id in STORE){const st=STORE[id];if(untouched(st))continue;const rv=snap.docs.find(d=>(d.data()||{}).id===id||d.id===storeKey(id));const ru=rv?(rv.data().updatedAt||0):-1;
    if((st.updatedAt||0)>ru){try{await db.doc("progress/"+storeKey(id)).set({id,json:JSON.stringify(st),updatedAt:st.updatedAt,streak:st.streak,rounds:st.rounds.length,proficient:st.proficient})}catch(e){}}}
  return changed}
(async()=>{let cdb=null;try{cdb=await window.claude?.use?.("db")}catch(e){cdb=null}
  if(cdb){db=cdb;SYNC.mode="claude"}else if(syncUrl()){db=remoteDb(syncUrl());SYNC.mode="web"}else return;
  try{if(await pullProgress()){ITEMS={};S=STORE[CUR];render()}}catch(e){SYNC.err=String(e.message||e)}
  await loadSchool();pushRecord();if(SYNC.mode==="web")document.getElementById("webnote").hidden=false;if(!document.getElementById("review").hidden)renderReview();
  if(SYNC.mode==="web")document.addEventListener("visibilitychange",async()=>{if(document.visibilityState!=="visible")return;try{if(await pullProgress()){ITEMS={};S=STORE[CUR];flash={};render()}}catch(e){}});
})();

</script>
